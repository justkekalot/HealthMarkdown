name: HealthMarkdown
options:
  bundleIdPrefix: app.escrime.healthmarkdown
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: MF369BT56X
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HealthMarkdown:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: HealthMarkdown.storekit
        buildPhase: none
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Health → MD
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: "HealthMarkdown reads your Health data on-device to compile a single Markdown summary you can hand to an AI assistant. Nothing leaves your phone unless you share it."
        NSHealthUpdateUsageDescription: "HealthMarkdown does not write to Health. This permission is unused."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Sources/Resources/HealthMarkdown.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.escrime.healthmarkdown
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  HealthMarkdown:
    build:
      targets:
        HealthMarkdown: all
    run:
      config: Debug
      storeKitConfiguration: HealthMarkdown.storekit
