name: HealthMarkdown
options:
  bundleIdPrefix: app.escrime.healthmarkdown
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: P44V8VH6DG
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  # Vendored locally: upstream's Package.swift uses .unsafeFlags (-all_load),
  # which SwiftPM rejects for app dependencies. The vendored copy strips that
  # flag; -all_load is set on the app's OTHER_LDFLAGS below instead.
  LiteRTLM:
    path: Vendor/LiteRT-LM

targets:
  HealthMarkdown:
    type: application
    platform: iOS
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    sources:
      - path: Sources
      - path: HealthMarkdown.storekit
        buildPhase: none
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Health → MD
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: "HealthMarkdown reads your Health data on-device to compile a single Markdown summary you can hand to an AI assistant. Nothing leaves your phone unless you share it."
        NSHealthUpdateUsageDescription: "HealthMarkdown does not write to Health. This permission is unused."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Sources/Resources/HealthMarkdown.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Paid Amden team supports these — lets large LiteRT-LM models load
        # without hitting the default per-process memory ceiling.
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.amden.healthmarkdown
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # LiteRTLM needs -all_load (its xcframework registers ObjC categories at
        # link time). Set here since we stripped it from the vendored package.
        OTHER_LDFLAGS: "-Xlinker -all_load"

schemes:
  HealthMarkdown:
    build:
      targets:
        HealthMarkdown: all
    run:
      config: Debug
      storeKitConfiguration: HealthMarkdown.storekit
